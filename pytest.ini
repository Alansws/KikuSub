[pytest]
testpaths = tests
pythonpath = .
addopts = -ra

; marker 的目的不是"跑得快"，而是让"为什么这条用例在这台机器上不跑"变成可查询的事实。
; 全量 40s，日常不需要分层；真正重型的在 tests/ 之外（截图矩阵、sidecar 重打、打包、评测台）。
markers =
    needs_ffmpeg: 依赖系统 ffmpeg / ffprobe
    needs_macos: 只能在 macOS 跑（say、字体表）
    needs_model: 需要模型权重（默认跳过，设 KIKUSUB_TEST_TTS_MODEL=1 才跑）
    integration: 跨层用例（HTTP + 子进程 + 会话写回），不是纯函数
