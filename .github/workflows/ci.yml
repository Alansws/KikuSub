name: CI

on:
  push:
    branches: [main, app/macos]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只装 ruff。torch / transformers 体积过大，而这里的检查不需要它们：
      # core/presets.py 仅依赖标准库，compileall 只做语法编译。
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Compile sources
        run: python -m compileall -q core server

      - name: Validate presets.json
        run: |
          python - <<'PY'
          from core.presets import PresetStore

          store = PresetStore()
          assert not store.load_error, store.load_error
          assert store.names(), "presets.json has no usable presets"
          for name, engine in store.list():
              print(f"{name}  [{engine or 'generic'}]")
          PY

  test:
    # 2026-11 新增：此前 CI 只 lint，410 个用例全靠人记得跑。
    # CPU 版 torch 足够（用例用替身引擎，不加载权重），整套约 40s。
    name: Pytest + kernel smoke
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # transformers 在导入链上（core.qwen_ctc 的模块级 import），uvicorn 供
          # tests/test_server_api.py 的握手用例起子进程，httpx 是 starlette TestClient 的硬依赖。
          pip install "transformers>=5.13.0,<6" huggingface_hub "silero-vad>=5.1.0" \
                      fastapi uvicorn websockets "numpy>=1.24.0" "soundfile>=0.12.1" \
                      "Pillow>=10" httpx pytest

      - name: Kernel smoke
        run: python -m core.smoke

      - name: Pytest
        # 需要 OmniVoice 权重的用例自带 importorskip，缺席时 skip。
        run: pytest -q
