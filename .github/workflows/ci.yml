name: CI

on:
  push:
    branches: [main, app/macos]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint & validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 只装 ruff。torch / transformers 体积过大，而这里的检查不需要它们：
      # core/presets.py 仅依赖标准库，compileall 只做语法编译。
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Lint
        run: ruff check .

      - name: Compile sources
        run: python -m compileall -q core server

      - name: Validate presets.json
        run: |
          python - <<'PY'
          from core.presets import PresetStore

          store = PresetStore()
          assert not store.load_error, store.load_error
          assert store.names(), "presets.json has no usable presets"
          for name, engine in store.list():
              print(f"{name}  [{engine or 'generic'}]")
          PY

  test:
    # 2026-11 新增：此前 CI 只 lint，410 个用例全靠人记得跑。
    # CPU 版 torch 足够（用例用替身引擎，不加载权重），整套约 40s。
    name: Pytest + kernel smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          # transformers 在导入链上（core.qwen_ctc 的模块级 import），uvicorn 供
          # tests/test_server_api.py 的握手用例起子进程，httpx 是 starlette TestClient 的硬依赖。
          pip install "transformers>=5.13.0,<6" huggingface_hub "silero-vad>=5.1.0" \
                      fastapi uvicorn websockets "numpy>=1.24.0" "soundfile>=0.12.1" \
                      "Pillow>=10" httpx pytest

      # 媒体相关用例（server/media、translations、jobs）会真的调 ffprobe；
      # 少了它整片 77 个用例变成 KeyError: 'id'，看起来像代码坏了，其实是环境缺件。
      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffprobe -version | head -1

      - name: Kernel smoke
        run: python -m core.smoke

      - name: Pytest
        # 需要 OmniVoice 权重的用例自带 importorskip，缺席时 skip。
        run: pytest -q

  release-tag:
    # 发版闸门（2026-11-13 起）。两个断言都是"程序化硬约束"，写在 docs/release.md §7：
    #   ① tag 名必须等于 desktop/package.json 的 version —— 否则 About 面板、DMG 文件名
    #      与 Git 标签三处互相打架；
    #   ② tag 的提交必须在 main 上 —— main 是主线，开发在 app/macos，发版只能从 main 打 tag。
    # 只有推 v* tag 时才跑，不影响日常分支的 CI 时长。
    name: Release tag consistency
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史 + main 的提交，才能做祖先判断
          fetch-depth: 0

      - name: tag 必须等于 package.json 的 version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c "import json;print(json.load(open('desktop/package.json', encoding='utf-8'))['version'])")"
          echo "tag=$tag  package.json=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag v$tag 与 desktop/package.json 的 version $ver 不一致。先改版本号再打 tag。"
            exit 1
          fi
          echo "✅ 版本号一致"

      - name: tag 必须打在主线上
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "✅ tag 提交在 main 上"
          else
            echo "::error::该 tag 的提交不在 main 上。main 是主线：先把 app/macos 合入 main，再从 main 打 tag。"
            exit 1
          fi

  desktop:
    # 桌面层的 CI（2026-11-13 起）。此前 CI 只覆盖 Python：主进程 1570 行 + 渲染层的
    # 改动在 CI 里完全不可见，`npm run test:main` 只在人记得的时候跑。
    name: Desktop (typecheck + build + main-process tests)
    runs-on: ubuntu-latest
    env:
      # CI 不启动 Electron（只做类型检查、vite 构建与 node:test），省掉 ~100MB 的二进制下载
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install (npm ci)
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Typecheck（tsc --noEmit）
        working-directory: desktop
        run: npm run check

      - name: Build renderer
        working-directory: desktop
        run: npm run build

      - name: Main-process tests
        working-directory: desktop
        run: npm run test:main
