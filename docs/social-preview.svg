<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">KikuSub</title>
  <desc id="desc">KikuSub 应用图标（蓝紫渐变 K + 播放键 + 胶片）居中，下面是字标与产品定位。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C111A"/>
      <stop offset="1" stop-color="#101724"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.55">
      <stop offset="0" stop-color="#3B5BFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#3B5BFF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#3B5BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <image href="app-icon.png" x="540" y="72" width="200" height="200"/>

  <text x="640" y="400" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-2">
    <tspan fill="#F5F7FB">Kiku</tspan><tspan fill="#8FA6FF">Sub</tspan>
  </text>

  <text x="640" y="452" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="26" font-weight="400" fill="#9BA7BC" letter-spacing="0.3">Japanese subtitle transcription · frame-accurate timing review</text>

  <text x="640" y="556" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="21" font-weight="400" fill="#5F6B80" letter-spacing="0.4">macOS desktop app · Anime Whisper / Qwen3-ASR + CTC · Local-first</text>
</svg>
